<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="jquery-3.7.1.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div th:replace="common/navbar :: common-navbar" />
<div class="container mt-4">
    <h2 class="text-center mb-4">
        Student Submissions
    </h2>
    <a href="/profprofile"><button type="button" class="btn btn-secondary"><i class="bi bi-arrow-left"> Back to Profile</i></button></a>
    <br>
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="s : ${submittedStudents}">
            <div>
                <strong>Student Name:</strong> <span th:text="${s.firstName}"></span><br>
                <strong>ID:</strong> <span th:text="${s.id}"></span><br>
                <strong>File Name:</strong> <span th:text="${s.fileName}"></span>
            </div>
            <button class="btn btn-primary btn-sm download-btn">Download</button>
        </li>
    </ul>
</div>

<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>-->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const downloadButtons = document.querySelectorAll('.download-btn');

        downloadButtons.forEach(button => {
            button.addEventListener('click', function () {
                this.disabled = true;
                this.classList.remove('btn-primary');
                this.classList.add('btn-secondary');
                this.textContent = 'Downloaded';
            });
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
        // Function to fetch the user role from the server
        function fetchUserRole() {
            return fetch("/api/navBar/getRole")
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok");
                    }
                    return response.text();
                })
                .catch((error) => {
                    console.error("Error fetching user role:", error);
                    return "Guest"; // Default to "Guest" on error
                });
        }

        // Get menu elements
        const professorMenu = document.getElementById("professor");
        const studentMenu = document.getElementById("student");
        const loginMenu = document.getElementById("login");
        const logoutMenu = document.getElementById("logout");

        // Hide all menus initially
        professorMenu.style.display = "none";
        studentMenu.style.display = "none";
        loginMenu.style.display = "none";
        logoutMenu.style.display = "none";

        // Fetch user role and update UI accordingly
        fetchUserRole().then((userRole) => {

            // Show/hide menus based on user role
            if (userRole === "Student") {
                studentMenu.style.display = "block";
                logoutMenu.style.display = "block";
            } else if (userRole === "Professor") {
                professorMenu.style.display = "block";
                logoutMenu.style.display = "block";
            } else if (userRole === "Admin") {
                professorMenu.style.display = "block";
                studentMenu.style.display = "block";
                logoutMenu.style.display = "block";
            } else {
                loginMenu.style.display = "block"; // Guest user
            }
        });
    });
</script>
</body>
</html>
